name: Convert movie

on:
  workflow_dispatch:
    inputs:
      movie_id:
        description: UUID of the movie row to process
        required: true
        type: string
      apply:
        description: Apply conversion and update storage/database; leave false for a dry run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: convert-movie-${{ github.repository }}
  cancel-in-progress: false

jobs:
  process-movie:
    runs-on: ubuntu-latest
    # Bound a potentially long FFmpeg job to two hours; review after measuring real conversions.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Process movie
        working-directory: backend
        env:
          MOVIE_ID: ${{ inputs.movie_id }}
          APPLY: ${{ inputs.apply }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          args=(--movie-id "$MOVIE_ID")
          if [[ "$APPLY" == "true" ]]; then
            args+=(--apply)
          fi
          node scripts/process-movie.mjs "${args[@]}"

      - name: Clean processor temporary files
        if: always()
        run: |
          find /tmp -mindepth 1 -maxdepth 1 -type d \
            -name 'geniuz-movie-process-*' \
            -user "$(id -un)" \
            -exec rm -rf -- {} +
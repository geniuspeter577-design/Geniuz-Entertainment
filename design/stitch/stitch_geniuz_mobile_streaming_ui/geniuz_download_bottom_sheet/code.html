<!-- Inline Micro-interactions Script -->
<script>
    (function initDownloadSheetInteractions() {
      const checkboxes = document.querySelectorAll('.item-checkbox');
      const downloadLabel = document.getElementById('downloadBtnLabel');
      const toggleSelectAllBtn = document.getElementById('toggleSelectAllBtn');
      const downloadBtn = document.getElementById('startDownloadActionBtn');

      function refreshDownloadState() {
        let count = 0;
        let totalSize = 0;

        checkboxes.forEach(cb => {
          const card = cb.closest('.download-item-card');
          const indicator = card.querySelector('.checkbox-indicator');
          const size = parseInt(card.getAttribute('data-size') || '0', 10);

          if (cb.checked) {
            count++;
            totalSize += size;
            indicator.className = 'checkbox-indicator w-6 h-6 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0';
          } else {
            indicator.className = 'checkbox-indicator w-6 h-6 rounded-full bg-surface-container-highest text-transparent flex items-center justify-center shrink-0';
          }
        });

        if (count > 0) {
          downloadLabel.textContent = 'Download (' + count + ') · ' + totalSize + ' MB';
          downloadBtn.removeAttribute('disabled');
          downloadBtn.classList.remove('opacity-40', 'pointer-events-none');
          toggleSelectAllBtn.textContent = (count === checkboxes.length) ? 'Deselect all' : 'Select all';
        } else {
          downloadLabel.textContent = 'Select items to download';
          downloadBtn.setAttribute('disabled', 'true');
          downloadBtn.classList.add('opacity-40', 'pointer-events-none');
          toggleSelectAllBtn.textContent = 'Select all';
        }
      }

      checkboxes.forEach(cb => {
        cb.addEventListener('change', refreshDownloadState);
      });

      if (toggleSelectAllBtn) {
        toggleSelectAllBtn.addEventListener('click', () => {
          const anyUnchecked = Array.from(checkboxes).some(cb => !cb.checked);
          checkboxes.forEach(cb => {
            cb.checked = anyUnchecked;
          });
          refreshDownloadState();
        });
      }

      if (downloadBtn) {
        downloadBtn.addEventListener('click', () => {
          const originalText = downloadLabel.textContent;
          downloadLabel.textContent = 'Adding to queue...';
          downloadBtn.classList.add('animate-pulse');
          setTimeout(() => {
            downloadBtn.classList.remove('animate-pulse');
            downloadLabel.textContent = 'Queue started!';
            setTimeout(() => {
              downloadLabel.textContent = originalText;
            }, 1800);
          }, 650);
        });
      }
    })();
  </script>
